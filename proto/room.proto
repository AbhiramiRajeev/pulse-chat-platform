syntax = "proto3";

package room;

option go_package = "github.com/AbhiramiRajeev/pulse-chat-platform/proto/roompb;roompb";

service RoomService {
  rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
  rpc GetRooms(GetRoomsRequest) returns (GetRoomsResponse);
  rpc IsUserInRoom(IsUserInRoomRequest) returns (IsUserInRoomResponse);
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
}

message CreateRoomRequest {
  string name = 1;
  string user_id = 2;
}

message CreateRoomResponse {
  string id = 1;
  string name = 2;
  string created_by = 3;
  string created_at = 4;
}

message GetRoomsRequest {
  string user_id = 1;
}

message Room {
  string id = 1;
  string name = 2;
  string created_by = 3;
  string created_at = 4;
}

message GetRoomsResponse {
  repeated Room rooms = 1;
}

message IsUserInRoomRequest {
  string room_id = 1;
  string user_id = 2;
}

message IsUserInRoomResponse {
  bool is_member = 1;
}

message AddMemberRequest {
  string room_id = 1;
  string user_id = 2;
  string requesting_user_id = 3;
}

message AddMemberResponse {
  bool success = 1;
  string message = 2;
}

message RoomMember {
  string user_id = 1;
  string username = 2;
  string email = 3;
  string joined_at = 4;
}

message ListMembersRequest {
  string room_id = 1;
}

message ListMembersResponse {
  repeated RoomMember members = 1;
}