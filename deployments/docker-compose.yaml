services:
  postgres:
    image: postgres:16
    container_name: pulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pulse_chat}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pulse_chat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pulse-redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    container_name: pulse-mongodb
    ports:
      - "${MONGO_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  chat-service:
    build:
      context: ..
      dockerfile: chat-service/Dockerfile
    container_name: pulse-chat-service
    environment:
      GRPC_PORT: "50051"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-pulse_chat}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: ${MONGO_DATABASE:-pulse_chat}
      JWT_SECRET: ${JWT_SECRET:-changeme-secret-key}
      JWT_EXPIRY: ${JWT_EXPIRY:-24h}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    ports:
      - "${GRPC_HOST_PORT:-50051}:50051"

  api-gateway:
    build:
      context: ..
      dockerfile: api-gateway/Dockerfile
    container_name: pulse-api-gateway
    environment:
      HTTP_PORT: "8080"
      CHAT_SERVICE_ADDR: chat-service:50051
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      JWT_SECRET: ${JWT_SECRET:-changeme-secret-key}
    depends_on:
      chat-service:
        condition: service_started
      redis:
        condition: service_healthy
    ports:
      - "${HTTP_HOST_PORT:-8080}:8080"

volumes:
  postgres_data:
  mongodb_data:
